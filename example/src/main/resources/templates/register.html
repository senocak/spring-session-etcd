<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Auth</title>
</head>
<body>
    <div th:replace="~{fragments/header :: siteHeader}"></div>
    <br /><br /><br />
    <h2>Registration</h2>
    <div th:if="${param.success}">You have successfully registered our app.!</div>
    <form method="post" role="form" th:action="@{/register/save}" th:object="${user}">
        <div>
            <label>Name</label>
            <input id="name" name="name" placeholder="Enter name" th:field="*{name}" type="text"/>
            <p th:errors="*{name}" th:if="${#fields.hasErrors('name')}"></p>
        </div>
        <div>
            <label>Email</label>
            <input id="email" name="email" placeholder="Enter Email address" th:field="*{email}" type="email"/>
            <p th:errors="*{email}" th:if="${#fields.hasErrors('email')}"></p>
        </div>
        <div>
            <label>Password</label>
            <input id="password" name="password" placeholder="Enter password" th:field="*{password}" type="password"/>
            <p th:errors="*{password}" th:if="${#fields.hasErrors('password')}"></p>
        </div>
        <div>
            <button type="submit">Register</button>
        </div>
    </form>
</body>
</html>
