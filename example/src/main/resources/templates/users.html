<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Auth</title>
</head>
<body>
    <div th:replace="~{fragments/header :: siteHeader}"></div>
    <h2>List of Registered Users</h2>
    <table>
        <thread>
            <tr>
                <th>Name</th>
                <th>Email</th>
            </tr>
        </thread>
        <tbody>
             <tr th:each="user : ${users}">
                 <td th:text="${user.name}"></td>
                 <td th:text="${user.email}"></td>
             </tr>
        </tbody>
    </table>
</body>
</html>
