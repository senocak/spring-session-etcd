<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Auth</title>
</head>
<body>
    <div th:replace="~{fragments/header :: siteHeader}"></div>
    <br/>
    <div th:if="${param.error}"><div> Invalid Email or Invalid password</div></div>
    <div th:if="${param.logout}"><div>You have been logged out</div></div>
    <h2>Login Form</h2>
    <form method="post" role="form" th:action="@{/login}">
        <div>
            <label>Email</label>
            <input type="text" id="username" name="username" placeholder="Enter Email address"/>
        </div>
        <div>
            <label>Password</label>
            <input type="text" id="password" name="password" placeholder="Enter password"/>
        </div>
        <div>
            <button type="submit">Submit</button>
        </div>
    </form>
</body>
</html>
